<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stellar Balance Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Stellar Balance Viewer</h1>
    <p class="subtitle">Look up the balances of any Stellar account.</p>

    <form id="lookup-form">
      <label for="network">Network</label>
      <select id="network">
        <option value="testnet">Testnet</option>
        <option value="mainnet">Mainnet</option>
      </select>

      <label for="public-key">Public key</label>
      <input id="public-key" type="text" placeholder="G..." autocomplete="off" required>

      <button type="submit">Check balances</button>
    </form>

    <p id="status" class="status" aria-live="polite"></p>

    <section id="result" class="result" hidden>
      <h2>Account</h2>
      <p id="account-id" class="account-id"></p>
      <p id="sequence" class="meta"></p>
      <h2>Balances</h2>
      <ul id="balances" class="balances"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
